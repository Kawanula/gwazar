<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Hub | Kawanula Boss</title>
    <style>
        /* Styles remain consistent with previous design for brand identity */
        body { margin: 0; font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e1b4b); background-size: 400% 400%; animation: gradient 15s ease infinite; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0 80px 0; color: white; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 2rem; text-align: center; width: 90%; max-width: 800px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
        h1 { font-size: 1.8rem; color: #f43f5e; margin-bottom: 15px; }
        .header-section { margin-bottom: 15px; display: flex; justify-content: space-between; width: 90%; max-width: 800px; }
        .top-btn { background: rgba(255,255,255,0.1); color: white; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 0.8rem; }
        
        /* APP VIEW LOGIC */
        .app-view { display: none; animation: fadeIn 0.3s ease; text-align: left; }
        .app-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ADMIN SPECIFIC STYLES */
        .admin-section { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; border: 2px solid #ef4444; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid #94a3b8; }
        .user-row.is-seller { border-left-color: #10b981; }
        .approve-btn { background: #10b981; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .revoke-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }

        /* FORM STYLES */
        .form-group { margin-bottom: 10px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

        /* POST STYLES */
        .data-display { margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .post-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 12px; position: relative; }
        .vault-card { border-left: 4px solid #3b82f6; display: flex; justify-content: space-between; align-items: center; }
        .market-card { border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; overflow: hidden; }
        .market-img { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .nuke-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; margin-top: 5px; }

        /* NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #1e293b; }
        .nav-item { background: none; border: none; color: #64748b; font-size: 0.7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: white; font-weight: bold; }
        
        .paywall-banner { background: #1e293b; border: 1px dashed #10b981; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="login-screen" class="glass-container" style="margin-top: 15vh;">
        <h1>🔐 Vault Access</h1>
        <button id="loginBtn" class="submit-btn" style="background: white; color: black;">Sign in with Google</button>
    </div>

    <div id="main-app" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <div class="header-section">
            <span style="font-weight: bold; color: #38bdf8;" id="userGreeting">User</span>
            <button id="headerAdminBtn" class="top-btn" style="display:none; border-color: #ef4444; color: #ef4444;">🛡️ Admin Dashboard</button>
        </div>

        <div class="glass-container">
            <h1 id="view-title">🎯 Target Hub</h1>

            <div id="view-ideas" class="app-view active">
                <div class="form-group"><textarea id="pitchIdea" rows="2" placeholder="Got a business idea? Pitch it here..."></textarea></div>
                <button id="submitIdeaBtn" class="submit-btn" style="background: #eab308; color: black;">Broadcast Idea</button>
                <div id="ideas-display" class="data-display"></div>
            </div>

            <div id="view-market" class="app-view">
                <div id="seller-gate" class="paywall-banner">
                    <p style="margin:0 0 10px 0;">To sell items here, contact the Boss.</p>
                    <a id="waLink" href="#" class="top-btn" style="background:#25D366; border:none; text-decoration:none; display:inline-block;">WhatsApp Boss</a>
                </div>
                <div id="market-upload-area" style="display:none;">
                    <div class="form-group"><input type="text" id="itemName" placeholder="Item Name"></div>
                    <div class="form-group"><input type="text" id="itemPrice" placeholder="Price (e.g. MWK 50,000)"></div>
                    <div class="form-group" style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px;"><input type="file" id="itemPhoto"></div>
                    <button id="submitMarketBtn" class="submit-btn" style="background: #10b981; color: white;">List Item</button>
                </div>
                <div id="market-display" class="data-display"></div>
            </div>

            <div id="view-vault" class="app-view">
                <div id="boss-vault-upload" style="display:none; margin-bottom: 20px; padding:15px; border: 1px solid #3b82f6; border-radius:12px;">
                    <h3 style="margin-top:0; color:#3b82f6;">Upload Direct Content</h3>
                    <div class="form-group"><input type="text" id="vTitle" placeholder="File Title"></div>
                    <div class="form-group"><select id="vCat"><option>📚 Book/PDF</option><option>🎵 Audio</option><option>🎬 Video</option></select></div>
                    <div class="form-group"><input type="file" id="vFile"></div>
                    <button id="submitVaultBtn" class="submit-btn" style="background:#3b82f6; color:white;">Upload to Vault</button>
                    <p id="vStatus" style="font-size:0.7rem; margin-top:5px;"></p>
                </div>
                <div id="vault-display" class="data-display"></div>
            </div>

            <div id="view-admin" class="app-view admin-section">
                <h2 style="color: #ef4444; margin-top: 0;">System Control</h2>
                <h3 style="font-size: 0.9rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 5px;">Manage Sellers</h3>
                <div id="admin-user-list"></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-ideas"><span>💡</span>Ideas</button>
            <button class="nav-item" data-target="view-market"><span>🛒</span>Market</button>
            <button class="nav-item" data-target="view-vault"><span>☁️</span>Vault</button>
            <button class="nav-item" data-target="view-admin" id="adminNavBtn" style="display:none;"><span>🛡️</span>Admin</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";

        // 👑 YOUR CREDENTIALS HARDCODED HERE 👑
        const BOSS_EMAIL = "kawanularedson@gmail.com"; 
        const BOSS_WA = "265993965546";

        const firebaseConfig = {
            apiKey: "AIzaSyCP6hhb62phviKZGen1CZss24dJ9BerIJQ",
            authDomain: "gwazar-super-app.firebaseapp.com",
            databaseURL: "https://gwazar-super-app-default-rtdb.firebaseio.com",
            projectId: "gwazar-super-app",
            storageBucket: "gwazar-super-app.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let user = null;
        let isBoss = false;

        // Auto-generate WhatsApp link
        document.getElementById('waLink').href = `https://wa.me/${BOSS_WA}?text=Hello Boss, I would like to purchase a Seller License for Target Hub.`;

        // AUTH
        document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                isBoss = (u.email === BOSS_EMAIL);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                
                if(isBoss) {
                    document.getElementById('userGreeting').innerText = `Boss ${u.displayName.split(' ')[0]}`;
                    document.getElementById('headerAdminBtn').style.display = 'block';
                    document.getElementById('adminNavBtn').style.display = 'flex';
                    document.getElementById('boss-vault-upload').style.display = 'block';
                    loadAdminData();
                } else {
                    document.getElementById('userGreeting').innerText = `${u.displayName.split(' ')[0]}`;
                }
                
                // Record user in global list for Admin to see
                set(ref(db, `target_users/${u.uid}`), { name: u.displayName, email: u.email });

                checkSellerStatus();
            }
        });

        // TABS
        document.querySelectorAll('.nav-item, #headerAdminBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-target') || 'view-admin';
                document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(target).classList.add('active');
                if(btn.classList.contains('nav-item')) btn.classList.add('active');
            });
        });

        // SELLER STATUS
        function checkSellerStatus() {
            if(isBoss) { document.getElementById('market-upload-area').style.display = 'block'; document.getElementById('seller-gate').style.display = 'none'; return; }
            onValue(ref(db, `target_approved_sellers/${user.uid}`), s => {
                if(s.exists()) {
                    document.getElementById('market-upload-area').style.display = 'block';
                    document.getElementById('seller-gate').style.display = 'none';
                }
            });
        }

        // ADMIN LOGIC
        function loadAdminData() {
            onValue(ref(db, 'target_users'), (snap) => {
                const list = document.getElementById('admin-user-list'); list.innerHTML = '';
                snap.forEach(child => {
                    const uData = child.val(); const uUid = child.key;
                    if(uData.email === BOSS_EMAIL) return; // Hide Boss from the list
                    
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<div><strong>${uData.name}</strong><br><small>${uData.email}</small></div>
                                    <div id="ctrl-${uUid}">Loading...</div>`;
                    list.appendChild(row);

                    onValue(ref(db, `target_approved_sellers/${uUid}`), s => {
                        const ctrl = document.getElementById(`ctrl-${uUid}`);
                        if(s.exists()) {
                            row.classList.add('is-seller');
                            ctrl.innerHTML = `<button class="revoke-btn" onclick="window.toggleSeller('${uUid}', false)">Revoke Access</button>`;
                        } else {
                            row.classList.remove('is-seller');
                            ctrl.innerHTML = `<button class="approve-btn" onclick="window.toggleSeller('${uUid}', true)">Authorize Seller</button>`;
                        }
                    });
                });
            });
        }
        window.toggleSeller = (uid, status) => {
            if(status) set(ref(db, `target_approved_sellers/${uid}`), true);
            else remove(ref(db, `target_approved_sellers/${uid}`));
        };

        // VAULT UPLOAD (BOSS ONLY)
        document.getElementById('submitVaultBtn').addEventListener('click', () => {
            const file = document.getElementById('vFile').files[0];
            const title = document.getElementById('vTitle').value;
            if(!file || !isBoss) return;

            const sReference = sRef(storage, `vault/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(sReference, file);
            uploadTask.on('state_changed', 
                s => { document.getElementById('vStatus').innerText = `Uploading: ${Math.round((s.bytesTransferred/s.totalBytes)*100)}%`; },
                e => { alert("Storage Error: " + e.message); },
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then(url => {
                        push(ref(db, 'target_media_vault'), { title, url, category: document.getElementById('vCat').value });
                        document.getElementById('vStatus').innerText = "Uploaded! ✅";
                    });
                }
            );
        });

        // DISPLAY VAULT
        onValue(ref(db, 'target_media_vault'), s => {
            const d = document.getElementById('vault-display'); d.innerHTML = '';
            s.forEach(c => {
                const val = c.val();
                d.innerHTML += `<div class="post-card vault-card">
                    <div><strong>${val.title}</strong><br><small>${val.category}</small></div>
                    <a href="${val.url}" target="_blank" style="color:#3b82f6; font-weight:bold; text-decoration:none;">DOWNLOAD</a>
                    ${isBoss ? `<br><button class="nuke-btn" onclick="window.nuke('target_media_vault/${c.key}')">Delete</button>` : ''}
                </div>`;
            });
        });

        // MARKETPLACE DISPLAY
        onValue(ref(db, 'target_marketplace_visual'), s => {
            const d = document.getElementById('market-display'); d.innerHTML = '';
            s.forEach(c => {
                const val = c.val();
                d.innerHTML += `<div class="market-card post-card">
                    <img src="${val.image}" class="market-img">
                    <div style="padding:10px;">
                        <h4 style="margin:0;">${val.item}</h4>
                        <p style="color:#10b981; font-weight:bold;">${val.price}</p>
                        ${isBoss ? `<button class="nuke-btn" onclick="window.nuke('target_marketplace_visual/${c.key}')">Remove Item</button>` : ''}
                    </div>
                </div>`;
            });
        });

        window.nuke = (path) => { if(confirm("Boss, are you sure?")) remove(ref(db, path)); };

    </script>
</body>
</html>
