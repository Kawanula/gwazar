<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gwazar | Kawanula Hub</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            width: 85%;
            max-width: 400px;
        }

        h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; letter-spacing: -1px; }
        p { font-size: 0.9rem; opacity: 0.9; margin-bottom: 2rem; font-weight: 300; }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .link-item:hover {
            transform: translateY(-3px);
            background: #ffffff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Highlight the GitHub button */
        .github-btn { background: #0f172a; color: white; }
        .github-btn:hover { background: #000; }

    </style>
</head>
<body>

    <div class="glass-card">
        <h1>gwazar</h1>

        <div class="links">
            <a href="https://www.youtube.com" target="_blank" class="link-item">📺 My YouTube Channel</a>
            
            <a href="https://www.facebook.com/profile.php?id=61571492189302" target="_blank" class="link-item">👤 Facebook Profile</a>
            
            <a href="https://wa.me/265993965546" target="_blank" class="link-item">💬 WhatsApp Me</a>
            
            <a href="tel:+265883854012" class="link-item">📞 Call Support</a>
            
            <a href="mailto:kawanularedson@gmail.com" class="link-item">✉️ Email Me</a>

            <a href="https://github.com/Kawanula" target="_blank" class="link-item github-btn">📂 View GitHub Code</a>
        </div>
    </div>

</body>
</html>
