<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gwazar | Kawanula Hub</title>
    <meta name="description" content="Kawanula's Official Educational and Social Hub.">
    <meta property="og:image" content="https://github.com/Kawanula.png">
    <link rel="icon" type="image/png" href="https://github.com/Kawanula.png">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradient 15s ease infinite; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 2.5rem 2rem; border-radius: 2.5rem; text-align: center; color: white; width: 85%; max-width: 400px; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid white; margin-bottom: 1rem; object-fit: cover; }
        .bio-text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem; background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .link-item { background: rgba(255, 255, 255, 0.95); color: #1e293b; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .link-item:hover { transform: translateY(-3px); background: #fff; }
        .project-btn { background: #2563eb; color: white; border: 2px solid #fff; }
        .contact-section { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        .submit-btn { background: #23d5ab; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="glass-card">
        <img src="https://github.com/Kawanula.png" alt="Kawanula" class="profile-img">
        <h1>gwazar</h1>
        <div class="bio-text">👋 <strong>Hi, I'm Kawanula!</strong><br>I'm a student from Malawi. Explore my projects and get in touch!</div>
        
        <div class="links">
            <a href="projects.html" class="link-item project-btn">🚀 View My Projects</a>
            
            <a href="https://wa.me/265993965546" class="link-item">💬 WhatsApp Me</a>
            <a href="mailto:kawanularedson@gmail.com" class="link-item">✉️ Email Me</a>
            <a href="#" id="shareBtn" class="link-item" style="background:rgba(255,255,255,0.2); color:white;">🔗 Share Hub</a>
        </div>

        <div class="contact-section">
            <p>Send me a quick message:</p>
            <form action="https://formspree.io/f/kawanularedson@gmail.com" method="POST">
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
    <script>
      const shareBtn = document.getElementById('shareBtn');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({ title: 'gwazar | Kawanula Hub', url: window.location.href }).catch(console.error);
        }
      });
    </script>
</body>
</html>
