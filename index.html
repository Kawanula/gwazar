<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Kawanula's Official Educational and Social Hub. Find my YouTube, Facebook, and contact info here.">
    <meta name="keywords" content="Kawanula, Education, Malawi, Web Development, gwazar">

    <meta property="og:title" content="gwazar | Kawanula Hub">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem 2rem;
            border-radius: 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            width: 85%;
            max-width: 400px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 1rem;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; letter-spacing: -1px; }
        
        /* New Bio Section Style */
        .bio-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            font-weight: 300;
        }

        .links { display: flex; flex-direction: column; gap: 12px; }

        .link-item {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-item:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .github-btn { background: #0f172a; color: white; }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            margin-top: 10px;
        }

        /* Fixed Visitor Counter Style */
        .visitor-counter {
            margin-top: 25px;
            font-size: 0.85rem;
            opacity: 0.9;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 25px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="https://github.com/Kawanula.png" alt="Kawanula" class="profile-img">
        <h1>gwazar</h1>
        
        <div class="bio-text">
            👋 <strong>Hi, I'm Kawanula!</strong><br>
            I am a student and aspiring developer from Malawi. This is my official hub for education and social projects.
        </div>
        
        <div class="links">
            <a href="https://www.youtube.com" target="_blank" class="link-item">📺 My YouTube Channel</a>
            <a href="https://www.facebook.com/profile.php?id=61571492189302" target="_blank" class="link-item">👤 Facebook Profile</a>
            <a href="https://wa.me/265993965546" target="_blank" class="link-item">💬 WhatsApp Me</a>
            <a href="tel:+265883854012" class="link-item">📞 Call Support</a>
            <a href="mailto:kawanularedson@gmail.com" class="link-item">✉️ Email Me</a>
            <a href="https://github.com/Kawanula" target="_blank" class="link-item github-btn">📂 View GitHub Code</a>
            <a href="#" id="shareBtn" class="link-item share-btn">🔗 Share My Hub</a>
        </div>

        <div class="visitor-counter">
            <span>Total Hub Visits:</span>
            <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fgwazar.vercel.app&count_bg=%2379C83D&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false" alt="Visitor Count">
        </div>

        <div class="qr-section">
            <p style="font-size: 0.8rem; margin-bottom: 12px; opacity: 0.8;">Scan to share my Hub</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://gwazar.vercel.app" 
                 alt="QR Code" 
                 style="border-radius: 12px; border: 6px solid white; background: white; width: 110px; height: 110px;">
        </div>
    </div>

    <script>
      const shareBtn = document.getElementById('shareBtn');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({
            title: 'gwazar | Kawanula Hub',
            text: 'Check out Kawanula\'s official hub!',
            url: window.location.href
          }).catch(console.error);
        } else {
          alert("Copy this link: " + window.location.href);
        }
      });
    </script>

</body>
</html>
