<!DOCTYPE html>

<head>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem 2rem;
            border-radius: 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            width: 85%;
            max-width: 400px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 1rem;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 { font-size: 2.2rem; margin: 0 0 0.5rem 0; letter-spacing: -1px; }
        
        .bio-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
        }

        .links { display: flex; flex-direction: column; gap: 12px; }

        .link-item {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-item:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .project-btn { background: #0f172a; color: white; border: 1px solid #38bdf8; }

        .contact-section { 
            margin-top: 30px; 
            border-top: 1px solid rgba(255,255,255,0.2); 
            padding-top: 25px; 
            text-align: left;
        }
        .contact-section p { text-align: center; font-weight: bold; margin-bottom: 15px; }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 10px; 
            border: none; 
            box-sizing: border-box; 
            background: rgba(255,255,255,0.9);
            font-family: inherit;
        }
        .submit-btn { 
            background: #0f172a; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .visitor-counter { margin-top: 25px; font-size: 0.85rem; opacity: 0.9; }

        .qr-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 25px;
        }

<body>

    <div class="glass-card">
        <img src="https://github.com/Kawanula.png" alt="Kawanula" class="profile-img">
        <h1>gwazar</h1>
        
        <div class="bio-text">
            👋 <strong>Hi, I'm Kawanula!</strong><br>

        <div class="links">

            <a href="https://www.youtube.com" target="_blank" class="link-item">📺 YouTube Channel</a>

                <input type="hidden" name="_next" value="https://gwazar.vercel.app/projects.html">
                
                <input type="email" name="_replyto" placeholder="Your Email Address" required>
                <textarea name="message" rows="3" placeholder="Write your message here..." required></textarea>

            </form>
        </div>

        <div class="visitor-counter">

        <div class="qr-section">

    <script>
      const shareBtn = document.getElementById('shareBtn');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({
            title: 'gwazar | Kawanula Hub',
            text: 'Check out Kawanula\'s official hub!',
            url: window.location.href
          }).catch(console.error);
        } else {
          alert("Copy this link: " + window.location.href);
        }
      });
    </script>

</body>
</html>
