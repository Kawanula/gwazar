<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gwazar | Kawanula Hub</title>
    
    <meta name="description" content="Kawanula's Official Educational and Social Hub. Connect with me here.">
    <meta name="keywords" content="Kawanula, Education, Malawi, Web Development, gwazar">
    <meta name="author" content="Kawanula">
    <meta property="og:title" content="gwazar | Kawanula Hub">
    <meta property="og:description" content="Official Education & Social Hub. Connect with me here.">
    <meta property="og:image" content="https://github.com/Kawanula.png">
    <meta property="og:url" content="https://gwazar.vercel.app">
    
    <link rel="icon" type="image/png" href="https://github.com/Kawanula.png">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto; /* Changed to allow scrolling for the QR code */
            padding: 20px 0;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            width: 85%;
            max-width: 380px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 1rem;
            object-fit: cover;
        }

        h1 { font-size: 2rem; margin: 0 0 0.2rem 0; }
        p { font-size: 0.9rem; opacity: 0.9; margin-bottom: 1.5rem; }

        .links { display: flex; flex-direction: column; gap: 10px; }

        .link-item {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-item:hover { transform: translateY(-2px); background: #fff; }

        .github-btn { background: #0f172a; color: white; }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            margin-top: 10px;
        }

        .visitor-counter {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .qr-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="https://github.com/Kawanula.png" alt="Kawanula" class="profile-img">
        <h1>gwazar</h1>
        <p>Official Education & Social Hub</p>
        
        <div class="links">
            <a href="https://www.youtube.com" target="_blank" class="link-item">📺 My YouTube Channel</a>
            <a href="https://www.facebook.com/profile.php?id=61571492189302" target="_blank" class="link-item">👤 Facebook Profile</a>
            <a href="https://wa.me/265993965546" target="_blank" class="link-item">💬 WhatsApp Me</a>
            <a href="tel:+265883854012" class="link-item">📞 Call Support</a>
            <a href="mailto:kawanularedson@gmail.com" class="link-item">✉️ Email Me</a>
            <a href="https://github.com/Kawanula" target="_blank" class="link-item github-btn">📂 View GitHub Code</a>
            <a href="#" id="shareBtn" class="link-item share-btn">🔗 Share My Hub</a>
        </div>

        <div class="visitor-counter">
            <span>Visits:</span>
            <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fgwazar.vercel.app&count_bg=%2379C83D&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false" alt="Hits"/>
        </div>

        <div class="qr-section">
            <p style="font-size: 0.8rem; margin-bottom: 10px;">Scan to share my Hub</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://gwazar.vercel.app" 
                 alt="QR Code" 
                 style="border-radius: 10px; border: 5px solid white; background: white; width: 100px; height: 100px;">
        </div>
    </div>

    <script>
      const shareBtn = document.getElementById('shareBtn');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({
            title: 'gwazar | Kawanula Hub',
            text: 'Check out my official educational hub!',
            url: window.location.href
          }).catch(console.error);
        } else {
          alert("Copy this link: " + window.location.href);
        }
      });
    </script>

</body>
</html>
